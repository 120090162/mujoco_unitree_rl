policy_path: "{LEGGED_GYM_ROOT_DIR}/pre_train/go2/{model_name}"
xml_path: "{LEGGED_GYM_ROOT_DIR}/resources/unitree_go2/mjcf/scene.xml"
model_name: "robot_lab_policy.pt"
framework: "isaacgym"
# Total simulation time
simulation_duration: 60.0
# Simulation time step
simulation_dt: 0.005
viewer_dt: 0.02  # 50 fps for viewer
# Controller update frequency (meets the requirement of simulation_dt * controll_decimation=0.02; 50Hz)
control_decimation: 4
rows: 4
cols: 3
num_obs: 45
num_actions: 12
observations: ["ang_vel", "gravity_vec", "commands", "dof_pos", "dof_vel", "actions"]
observations_history: [0]  # 0 is the latest observation
clip_obs: 100.0
clip_actions_lower: [-100.0, -100.0, -100.0,
                -100.0, -100.0, -100.0,
                -100.0, -100.0, -100.0,
                -100.0, -100.0, -100.0]
clip_actions_upper: [100.0, 100.0, 100.0,
                100.0, 100.0, 100.0,
                100.0, 100.0, 100.0,
                100.0, 100.0, 100.0]
rl_kp: [20.0, 20.0, 20.0,
        20.0, 20.0, 20.0,
        20.0, 20.0, 20.0,
        20.0, 20.0, 20.0]
rl_kd: [0.5, 0.5, 0.5,
        0.5, 0.5, 0.5,
        0.5, 0.5, 0.5,
        0.5, 0.5, 0.5]
fixed_kp: [80.0, 80.0, 80.0,
        80.0, 80.0, 80.0,
        80.0, 80.0, 80.0,
        80.0, 80.0, 80.0]
fixed_kd: [3.0, 3.0, 3.0,
        3.0, 3.0, 3.0,
        3.0, 3.0, 3.0,
        3.0, 3.0, 3.0]
hip_scale_reduction: 0.5
hip_scale_reduction_indices: [0, 3, 6, 9]
action_scale: 0.25
action_scale_wheel: 0.0
wheel_indices: []
lin_vel_scale: 2.0
ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
commands_scale: [1.0, 1.0, 1.0]
torque_limits: [23.5, 23.5, 23.5,
                23.5, 23.5, 23.5,
                23.5, 23.5, 23.5,
                23.5, 23.5, 23.5]
default_dof_pos: [ 0.00, 0.80, -1.50,
                0.00, 0.80, -1.50,
                0.00, 0.80, -1.50,
                0.00, 0.80, -1.50]
joint_controller_names: ["FL_hip_controller", "FL_thigh_controller", "FL_calf_controller",
                          "FR_hip_controller", "FR_thigh_controller", "FR_calf_controller",
                          "RL_hip_controller", "RL_thigh_controller", "RL_calf_controller",
                          "RR_hip_controller", "RR_thigh_controller", "RR_calf_controller"]
cmd_init: [0.5, 0, 0]
